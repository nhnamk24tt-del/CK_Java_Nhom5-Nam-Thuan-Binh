server.port=${PORT:3000}
server.servlet.session.cookie.name=${SESSION_COOKIE_NAME:RENTWHEELS_USER_SESSION}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:xe}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never

app.jwt-secret=${JWT_SECRET:rentwheels_secret_key}
app.avatar-directory=${AVATAR_DIRECTORY:public/avatars}
app.assets-directory=${ASSETS_DIRECTORY:../baitap1/public/assets}
app.instance-role=${APP_INSTANCE_ROLE:user}
app.admin-url=${ADMIN_URL:http://localhost:3001}
